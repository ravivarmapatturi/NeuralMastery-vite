name: Deploy platform-vite to GitHub Pages

# DELIBERATELY MANUAL-ONLY (workflow_dispatch), never on push to main.
#
# Why: GitHub Pages via Actions has exactly one live deployment per repo
# (the `github-pages` environment, served by actions/deploy-pages@v4 --
# whichever workflow run deploys to it most recently is what's live,
# regardless of which workflow triggered it). If platform-vite ends up in
# the same repository as the existing Docusaurus site (platform/, which
# already deploys to that same environment on every push to main via its
# own deploy.yml), an auto-triggered push-to-main deploy here would silently
# race with -- and could overwrite -- the current live production site the
# very first time someone pushes after connecting the remote. That is
# explicitly out of scope until an approved cutover (see the platform-vite
# migration plan's Phase 4). Until then, this workflow only ever runs when
# someone deliberately clicks "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A distinct concurrency group from platform/'s "pages" group -- so even if
# this is manually triggered, it can't cancel/interleave with a concurrent
# Docusaurus deploy run. (If GitHub Pages truly only supports one active
# deployment target per repo, running this against the same repo as
# platform/ will still ultimately replace the live site on completion --
# that's the real cutover action, which is exactly why this workflow stays
# manual-only rather than automatic.)
concurrency:
  group: pages-vite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build (dist/, not Docusaurus's build/)
        run: npm run build

      - name: Install Playwright Chromium (for Pagefind's prerender step)
        run: npx playwright install --with-deps chromium

      - name: Generate Pagefind index
        run: npm run pagefind

      - name: Validate static output before deploying
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html missing" && exit 1)
          test -f dist/pagefind/pagefind.js || (echo "::error::Pagefind output missing" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
