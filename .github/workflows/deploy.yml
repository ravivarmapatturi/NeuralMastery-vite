name: Deploy platform-vite to GitHub Pages

# DELIBERATELY MANUAL-ONLY (workflow_dispatch), never on push to main.
#
# This repo (ravivarmapatturi/NeuralMastery-vite) is its own standalone
# repository, separate from the existing Docusaurus production site's repo
# (ravivarmapatturi/NeuralMastery) -- so each has its own independent
# `github-pages` Actions environment, and deploying this one cannot collide
# with or overwrite the other. The manual trigger is kept anyway during the
# content-migration period: this site is deliberately re-deployed after
# each verified batch of work, not automatically on every push, so a
# broken/incomplete commit never becomes the live preview without a human
# choosing that moment. Revisit once content migration + validation are
# complete and continuous deploys are actually wanted.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build (dist/, not Docusaurus's build/)
        run: npm run build

      - name: Install Playwright Chromium (for Pagefind's prerender step)
        run: npx playwright install --with-deps chromium

      - name: Generate Pagefind index
        run: npm run pagefind

      - name: Validate static output before deploying
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html missing" && exit 1)
          test -f dist/pagefind/pagefind.js || (echo "::error::Pagefind output missing" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
